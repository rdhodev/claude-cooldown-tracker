<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitor Limit Akun Claude</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1915">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Akun">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1915;
            --surface: #2b2a27;
            --surface2: #353430;
            --border: #3d3c38;
            --text: #ececea;
            --text2: #8b8b80;
            --accent: #D97757;
            --accent-dim: rgba(217,119,87,0.12);
            --green: #5cb585;
            --green-bg: rgba(92,181,133,0.1);
            --red: #e06c5c;
            --red-bg: rgba(224,108,92,0.1);
        }

        body {
            font-family: 'Söhne', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* safe area for notch devices */
        .header { padding-top: max(12px, env(safe-area-inset-top)); }
        .table-area { margin-bottom: max(8px, env(safe-area-inset-bottom)); }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 14px;
            padding-right: 14px;
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left iconify-icon {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .header-left h1 {
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .clock-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .clock-box iconify-icon {
            font-size: 0.9rem;
            color: var(--accent);
        }

        .clock-box span {
            font-size: 0.82rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        /* === SUMMARY === */
        .summary {
            display: flex;
            gap: 8px;
            padding: 0 14px 10px;
            flex-shrink: 0;
        }

        .stat {
            flex: 1;
            background: var(--surface);
            border-radius: 10px;
            padding: 8px 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.58rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        .stat.s-total .stat-val { color: var(--accent); }
        .stat.s-avail .stat-val { color: var(--green); }
        .stat.s-limit .stat-val { color: var(--red); }

        /* === TABLE AREA === */
        .table-area {
            flex: 1;
            overflow: hidden;
            margin-left: 8px;
            margin-right: 8px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .table-scroll {
            flex: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .table-scroll::-webkit-scrollbar { width: 3px; height: 3px; }
        .table-scroll::-webkit-scrollbar-track { background: transparent; }
        .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: 600px;
            width: 100%;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--surface2);
            padding: 10px 8px;
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        thead th .th-inner {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        thead th iconify-icon { font-size: 0.8rem; }

        /* Sticky columns */
        th:nth-child(1), td:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 3;
            width: 34px;
            min-width: 34px;
            text-align: center;
        }

        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 34px;
            z-index: 3;
            min-width: 110px;
        }

        thead th:nth-child(1),
        thead th:nth-child(2) { z-index: 5; }

        td:nth-child(2)::after,
        th:nth-child(2)::after {
            content: '';
            position: absolute;
            top: 0; right: -5px; bottom: 0;
            width: 5px;
            background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
            pointer-events: none;
        }

        th:nth-child(3) { min-width: 88px; }
        th:nth-child(4) { min-width: 88px; }
        th:nth-child(5) { min-width: 160px; }

        tbody td {
            padding: 7px 8px;
            font-size: 0.8rem;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        .cell-no {
            color: var(--text2);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .cell-name {
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.12s;
        }

        .badge:active { opacity: 0.65; }
        .badge iconify-icon { font-size: 0.85rem; }

        .badge.ok {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge.limit {
            background: var(--red-bg);
            color: var(--red);
        }

        /* Time input */
        .time-input {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 4px 5px;
            font-size: 0.75rem;
            font-family: inherit;
            width: 80px;
            outline: none;
        }

        .time-input:focus { border-color: var(--accent); }

        .time-input::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(0.3) hue-rotate(-10deg) brightness(1.1);
            cursor: pointer;
        }

        .dash { color: var(--border); }

        /* Task input */
        .task-input {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text);
            padding: 4px 6px;
            font-size: 0.75rem;
            font-family: inherit;
            width: 100%;
            min-width: 140px;
            outline: none;
        }

        .task-input::placeholder { color: var(--text2); opacity: 0.4; }

        .task-input:focus {
            border-color: var(--border);
            background: var(--bg);
        }


        @media (max-width: 480px) {
            th:nth-child(1), td:nth-child(1) { width: 28px; min-width: 28px; }
            th:nth-child(2), td:nth-child(2) { left: 28px; min-width: 100px; }
            .cell-name { font-size: 0.74rem; }
            .badge { padding: 3px 8px; font-size: 0.63rem; }
            .badge iconify-icon { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <iconify-icon icon="solar:monitor-smartphone-bold-duotone"></iconify-icon>
            <h1>Monitor Akun</h1>
        </div>
        <div class="clock-box">
            <iconify-icon icon="solar:clock-circle-bold"></iconify-icon>
            <span id="clock">--:--:--</span>
        </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="table-area">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th><div class="th-inner"><iconify-icon icon="solar:user-bold"></iconify-icon> Akun</div></th>
                        <th><div class="th-inner"><iconify-icon icon="solar:tag-horizontal-bold"></iconify-icon> Status</div></th>
                        <th><div class="th-inner"><iconify-icon icon="solar:alarm-bold"></iconify-icon> Reset</div></th>
                        <th><div class="th-inner"><iconify-icon icon="solar:pen-new-round-bold"></iconify-icon> Tugas</div></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

<script>
// === PWA: Service Worker & Install ===
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

// === App Logic ===
const ACCOUNTS = [
    'bangridho22','bangridho41','h2787270','Cha Hae-in',
    'hh1508249','hidayat22ti','hidayatridho968','hosting ebr',
    'penguin','Ridho.dev','rdho.hdyat','ridhohidayat973'
];
const KEY = 'claude_limit_v3';

const defaults = () => ACCOUNTS.map(n => ({ name:n, status:'ok', reset:'', task:'' }));

function load() {
    try {
        const d = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(d) && d.length === ACCOUNTS.length) return d;
    } catch(_){}
    return defaults();
}

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

let data = load();

const clockEl = document.getElementById('clock');
const bodyEl = document.getElementById('tableBody');
const summaryEl = document.getElementById('summary');

function tick() {
    const n = new Date();
    clockEl.textContent =
        String(n.getHours()).padStart(2,'0') + ':' +
        String(n.getMinutes()).padStart(2,'0') + ':' +
        String(n.getSeconds()).padStart(2,'0');
}

function renderSummary() {
    const t = data.length, l = data.filter(a => a.status==='limit').length;
    summaryEl.innerHTML =
        '<div class="stat s-total"><div class="stat-val">'+t+'</div><div class="stat-label">Total</div></div>' +
        '<div class="stat s-avail"><div class="stat-val">'+(t-l)+'</div><div class="stat-label">Tersedia</div></div>' +
        '<div class="stat s-limit"><div class="stat-val">'+l+'</div><div class="stat-label">Limit</div></div>';
}

function render() {
    bodyEl.innerHTML = '';
    data.forEach((acc, i) => {
        const tr = document.createElement('tr');

        const tdNo = document.createElement('td');
        tdNo.className = 'cell-no';
        tdNo.textContent = i + 1;

        const tdName = document.createElement('td');
        tdName.className = 'cell-name';
        tdName.textContent = acc.name;

        const tdStatus = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (acc.status === 'limit' ? 'limit' : 'ok');
        badge.innerHTML = acc.status === 'limit'
            ? '<iconify-icon icon="solar:close-circle-bold"></iconify-icon>Limit'
            : '<iconify-icon icon="solar:check-circle-bold"></iconify-icon>Aktif';
        badge.addEventListener('click', () => {
            acc.status = acc.status === 'ok' ? 'limit' : 'ok';
            if (acc.status === 'ok') acc.reset = '';
            save(); render();
        });
        tdStatus.appendChild(badge);

        const tdTime = document.createElement('td');
        if (acc.status === 'limit') {
            const inp = document.createElement('input');
            inp.type = 'time';
            inp.className = 'time-input';
            inp.value = acc.reset;
            inp.addEventListener('change', e => { acc.reset = e.target.value; save(); });
            tdTime.appendChild(inp);
        } else {
            const d = document.createElement('span');
            d.className = 'dash';
            d.textContent = '—';
            tdTime.appendChild(d);
        }

        const tdTask = document.createElement('td');
        const taskInp = document.createElement('input');
        taskInp.type = 'text';
        taskInp.className = 'task-input';
        taskInp.placeholder = 'tugas...';
        taskInp.value = acc.task;
        taskInp.addEventListener('input', e => { acc.task = e.target.value; save(); });
        tdTask.appendChild(taskInp);

        tr.append(tdNo, tdName, tdStatus, tdTime, tdTask);
        bodyEl.appendChild(tr);
    });
    renderSummary();
}

function autoReset() {
    const n = new Date();
    const now = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    let changed = false;
    data.forEach(a => {
        if (a.status === 'limit' && a.reset && a.reset <= now) {
            a.status = 'ok'; a.reset = ''; changed = true;
        }
    });
    if (changed) { save(); render(); }
}

tick(); render();
setInterval(() => { tick(); autoReset(); }, 1000);
</script>
</body>
</html>
